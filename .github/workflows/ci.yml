name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.19.0
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality (Biome + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  mutation-tests:
    name: Mutation tests (domain rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Scoped to the rules where a wrong answer costs money or exposes
      # somebody. A line-covered rule that no test actually pins down is what
      # this catches, and line coverage alone would not.
      - name: Mutation testing
        run: bun run --cwd packages/domain test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/domain/reports/mutation/
          retention-days: 7

  api-integration:
    name: API integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: creator_outdoor
          POSTGRES_PASSWORD: creator_outdoor
          POSTGRES_DB: creator_outdoor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator_outdoor -d creator_outdoor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://creator_outdoor:creator_outdoor@localhost:5432/creator_outdoor_test
      TEST_DATABASE_URL: postgres://creator_outdoor:creator_outdoor@localhost:5432/creator_outdoor_test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      - name: Integration tests
        run: bun run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The apps parse their configuration eagerly and refuse to start without
      # it, so a build needs one. `.env.example` holds development values only —
      # every secret in it is published in this repository and is useless
      # anywhere real. It is exported rather than copied to `.env`, because
      # turbo runs each task in its own process and only passes through the
      # variables declared in `turbo.json`; a dotenv file read by one process
      # never reaches the next one.
      - name: Development configuration
        run: grep -vE '^#|^$' .env.example >> "$GITHUB_ENV"
      - run: bun run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: creator_outdoor
          POSTGRES_PASSWORD: creator_outdoor
          POSTGRES_DB: creator_outdoor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator_outdoor -d creator_outdoor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://creator_outdoor:creator_outdoor@localhost:5432/creator_outdoor_e2e
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:3001
      ADMIN_ORIGIN: http://localhost:3002
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Playwright is a Node-only tool; it runs on the pinned Node 24 LTS release.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Development values for everything the apps need, then the job's own
      # overrides again: a later write to $GITHUB_ENV wins, and the E2E database
      # is not the one in `.env.example`.
      - name: Development configuration
        run: |
          grep -vE '^#|^$' .env.example >> "$GITHUB_ENV"
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "TEST_DATABASE_URL=$DATABASE_URL"
            echo "WEB_ORIGIN=$WEB_ORIGIN"
            echo "API_ORIGIN=$API_ORIGIN"
            echo "ADMIN_ORIGIN=$ADMIN_ORIGIN"
            # The suite is one visitor making a hundred requests, and it shares a
            # single bucket because Playwright sends no forwarded address. The
            # production limits would throttle it out of its own submissions —
            # which looked like a broken feature rather than a full bucket.
            echo "RATE_LIMIT_SUBMISSIONS_PER_HOUR=500"
            echo "RATE_LIMIT_BOOSTS_PER_HOUR=500"
            echo "RATE_LIMIT_REPORTS_PER_HOUR=500"
            echo "RATE_LIMIT_OPT_OUT_REQUESTS_PER_HOUR=500"
            echo "RATE_LIMIT_OPT_OUT_VERIFICATIONS_PER_HOUR=500"
          } >> "$GITHUB_ENV"
      - name: Prepare database
        run: |
          bun run db:migrate
          bun run db:seed
          # The seed truncates the ranking periods and inserts none, so a fresh
          # database has no closed week and the Hall da Fama has nothing to
          # show. The rollover is what creates that history, and three tests
          # need it — they passed locally only on a database where somebody had
          # run this by hand.
          bun run job:weekly-rollover
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright smoke
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

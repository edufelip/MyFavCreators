services:
  postgres:
    image: postgres:18.6-alpine
    container_name: creator-outdoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator_outdoor
      POSTGRES_PASSWORD: creator_outdoor
      POSTGRES_DB: creator_outdoor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_outdoor -d creator_outdoor"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
